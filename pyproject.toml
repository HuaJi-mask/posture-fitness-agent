[project]
name = "posture-fitness-agent"
version = "0.1.0"
description = "体态矫正与健身规划智能体"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # 核心框架
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-community>=0.4",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.3",
    
    # MCP
    "mcp>=1.0",
    
    # RAG
    "faiss-cpu>=1.10",
    
    # Web 服务
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    
    # 数据处理
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    
    # 数据库
    "SQLAlchemy>=2.0",
    
    # HTTP 客户端
    "httpx>=0.27",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts", "tests"]
